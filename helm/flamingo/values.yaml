# Default values for flamingo.
# This is a YAML-formatted file.

# Workload kind: "Deployment" or "DaemonSet"
# Use "DaemonSet" with hostNetwork: true to run on every node as a cluster-wide honeypot.
kind: Deployment

# replicaCount only applies when kind is "Deployment"
replicaCount: 1

# Host network mode: when true, pod uses host network namespace (recommended for DaemonSet mode)
hostNetwork: false
# dnsPolicy: ClusterFirst (default for deployment) or ClusterFirstWithHostNet (recommended when hostNetwork: true)
dnsPolicy: ClusterFirst

image:
  repository: ghcr.io/joshuacox/flamingo
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 65532

securityContext:
  # Capabilities required to bind to privileged ports (<1024)
  capabilities:
    add:
      - NET_BIND_SERVICE
  # runAsNonRoot: true
  # runAsUser: 65532

# Flamingo configuration options
config:
  # Comma-separated list of protocols to enable: ssh,snmp,ldap,http,dns,ftp,imap,pop3,smtp,redis,telnet,postgres,mysql,mongodb,smb,winrm,kerberos,docker,kubelet,etcd,vnc,mqtt
  protocols: "ssh,snmp,ldap,http,dns,ftp,imap,pop3,smtp,redis,telnet,postgres,mysql,mongodb,smb,winrm,kerberos,docker,kubelet,etcd,vnc,mqtt"

  # Verbose / Quiet flags
  verbose: false
  quiet: false
  dontIgnoreFailures: false

  # Protocol specific port configurations
  ports:
    ftp: "21"
    imap: "143"
    imaps: "993"
    pop3: "110"
    pop3s: "995"
    smtp: "25,587"
    smtps: "465"
    redis: "6379"
    telnet: "23"
    postgres: "5432"
    mysql: "3306"
    mongodb: "27017"
    smb: "445"
    winrm: "5985"
    winrms: "5986"
    kerberos: "88"
    docker: "2375"
    dockertls: "2376"
    kubelet: "10250"
    etcd: "2379"
    vnc: "5900"
    mqtt: "1883"
    mqtts: "8883"
    dns: "53,5353"
    dnsResolveToIP: ""
    snmp: "161"
    ssh: "22"
    ldap: "389"
    ldaps: "636"
    http: "80"
    https: "443"

  # Deception banners
  banners:
    pop3: "+OK Flamingo POP3 server ready"
    smtp: "220 Flamingo ESMTP Service ready"
    telnet: "Flamingo Honeypot Telnet Service\r\n"
    mysql: "8.0.35"

  # HTTP options
  httpRealm: "Administration"
  httpAuthMode: "ntlm" # ntlm or basic

  # TLS options
  tlsName: "localhost"
  tlsOrg: "Flamingo Feed, Inc."
  # Set to name of existing secret with tls.crt and tls.key
  customTlsSecret: ""

  # SSH host key options
  # Provide an existing secret name with key "id_rsa" or "ssh-host-key"
  sshHostKeySecret: ""

  # Output destinations passed as positional arguments to flamingo
  # Examples:
  #   - "stdout"
  #   - "/var/log/flamingo/creds.log"
  #   - "https://webhook.site/..."
  #   - "syslog:udp:syslog-server:514"
  #   - "es://http://elasticsearch:9200/flamingo"
  #   - "loki://http://loki:3100"
  #   - "splunk://https://splunk.corp:8088?token=HEC_TOKEN"
  #   - "discord://https://discord.com/api/webhooks/ID/TOKEN"
  #   - "teams://https://outlook.office.com/webhook/..."
  outputs:
    - "stdout"

  # Sensitive outputs to store in a chart-managed Kubernetes Secret and pass as args
  # Examples:
  #   - "https://hooks.slack.com/services/T00/B00/XXXX"
  #   - "splunk://https://splunk.corp:8088?token=SECRET_HEC_TOKEN"
  #   - "discord://https://discord.com/api/webhooks/ID/TOKEN"
  #   - "teams://https://outlook.office.com/webhook/..."
  secretOutputs: []

  # Existing secret name containing outputs (keys will be passed as args)
  existingOutputsSecret: ""

# Deception & Anti-Bruteforce Tarpit
tarpit:
  enabled: false
  # Max connection/request attempts per minute before delay kicks in (0 = disabled)
  threshold: 10
  # Duration to stall attacker requests (e.g. 3s, 5s)
  delay: "3s"

# Threat Intelligence & Enrichment options
enrichment:
  enabled: false
  # Path or mount path to MaxMind GeoLite2 City database
  geoipCityDB: ""
  # Path or mount path to MaxMind GeoLite2 ASN database
  geoipAsnDB: ""
  # Enable non-blocking reverse DNS lookups
  enableRdns: false
  # Path to custom Tor exit node IP list
  torList: ""
  # Path to custom scanner CIDR ranges and tags list
  scannerList: ""

# Persistence configuration (useful if logging to file)
persistence:
  enabled: false
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi
  mountPath: /var/log/flamingo

# Probes configuration
livenessProbe:
  enabled: false
  tcpSocket:
    port: 80
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  enabled: false
  tcpSocket:
    port: 80
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

# Service configuration
# Exposes listener ports on Kubernetes
service:
  type: ClusterIP
  # Annotations for cloud provider load balancers (e.g. AWS NLB, MetalLB)
  annotations: {}

  # If true, creates separate <name>-tcp and <name>-udp services instead of a single service.
  # Helpful for cloud providers (like AWS Classic ELB or certain Ingress controllers) that disallow mixed TCP/UDP services.
  splitProtocols: false

  # Specific annotations when splitProtocols is enabled
  tcpAnnotations: {}
  udpAnnotations: {}

  # List of ports to expose on the service
  ports:
    ftp:
      enabled: true
      port: 21
      targetPort: 21
      protocol: TCP
    imap:
      enabled: true
      port: 143
      targetPort: 143
      protocol: TCP
    imaps:
      enabled: true
      port: 993
      targetPort: 993
      protocol: TCP
    pop3:
      enabled: true
      port: 110
      targetPort: 110
      protocol: TCP
    pop3s:
      enabled: true
      port: 995
      targetPort: 995
      protocol: TCP
    smtp:
      enabled: true
      port: 25
      targetPort: 25
      protocol: TCP
    smtpSubmission:
      enabled: true
      port: 587
      targetPort: 587
      protocol: TCP
    smtps:
      enabled: true
      port: 465
      targetPort: 465
      protocol: TCP
    redis:
      enabled: true
      port: 6379
      targetPort: 6379
      protocol: TCP
    telnet:
      enabled: true
      port: 23
      targetPort: 23
      protocol: TCP
    postgres:
      enabled: true
      port: 5432
      targetPort: 5432
      protocol: TCP
    mysql:
      enabled: true
      port: 3306
      targetPort: 3306
      protocol: TCP
    mongodb:
      enabled: true
      port: 27017
      targetPort: 27017
      protocol: TCP
    smb:
      enabled: true
      port: 445
      targetPort: 445
      protocol: TCP
    winrm:
      enabled: true
      port: 5985
      targetPort: 5985
      protocol: TCP
    winrms:
      enabled: true
      port: 5986
      targetPort: 5986
      protocol: TCP
    kerberosTcp:
      enabled: true
      port: 88
      targetPort: 88
      protocol: TCP
    kerberosUdp:
      enabled: true
      port: 88
      targetPort: 88
      protocol: UDP
    docker:
      enabled: true
      port: 2375
      targetPort: 2375
      protocol: TCP
    dockertls:
      enabled: true
      port: 2376
      targetPort: 2376
      protocol: TCP
    kubelet:
      enabled: true
      port: 10250
      targetPort: 10250
      protocol: TCP
    etcd:
      enabled: true
      port: 2379
      targetPort: 2379
      protocol: TCP
    vnc:
      enabled: true
      port: 5900
      targetPort: 5900
      protocol: TCP
    mqtt:
      enabled: true
      port: 1883
      targetPort: 1883
      protocol: TCP
    mqtts:
      enabled: true
      port: 8883
      targetPort: 8883
      protocol: TCP
    ssh:
      enabled: true
      port: 22
      targetPort: 22
      protocol: TCP
    dnsTcp:
      enabled: true
      port: 53
      targetPort: 53
      protocol: TCP
    dnsUdp:
      enabled: true
      port: 53
      targetPort: 53
      protocol: UDP
    http:
      enabled: true
      port: 80
      targetPort: 80
      protocol: TCP
    snmp:
      enabled: true
      port: 161
      targetPort: 161
      protocol: UDP
    ldap:
      enabled: true
      port: 389
      targetPort: 389
      protocol: TCP
    https:
      enabled: true
      port: 443
      targetPort: 443
      protocol: TCP
    ldaps:
      enabled: true
      port: 636
      targetPort: 636
      protocol: TCP

# Metrics & Monitoring configuration
metrics:
  enabled: true
  port: 9090
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
    annotations: {}

# Grafana Dashboard ConfigMap for auto-importing into Grafana via sidecar
grafanaDashboard:
  enabled: false
  namespace: ""
  labels:
    grafana_dashboard: "1"
  annotations: {}

# Ingress configuration for HTTP/HTTPS listener
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: flamingo.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: flamingo-tls
  #    hosts:
  #      - flamingo.local

# NetworkPolicy configuration
networkPolicy:
  enabled: false
  # Allow ingress traffic from specific CIDR blocks or namespaces
  # Leave empty to allow from all
  ingress: []
    # - from:
    #     - podSelector: {}
    #     - namespaceSelector: {}
    #     - ipBlock:
    #         cidr: 10.0.0.0/8
  # Allow egress traffic to specific destinations (e.g. webhooks, syslogs)
  egress: []
    # - to:
    #     - ipBlock:
    #         cidr: 0.0.0.0/0

resources: {}
  # limits:
  #   cpu: 200m
  #   memory: 256Mi
  # requests:
  #   cpu: 50m
  #   memory: 64Mi

nodeSelector: {}

tolerations: []

affinity: {}

extraEnv: []
extraEnvFrom: []
extraVolumes: []
extraVolumeMounts: []
