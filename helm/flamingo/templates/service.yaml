# UDP Service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "flamingo.fullname" . }}-udp
  labels:
    {{- include "flamingo.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.service.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.service.udpAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "flamingo.selectorLabels" . | nindent 4 }}
  ports:
    {{- if .Values.service.ports.dnsUdp.enabled }}
    - port: {{ .Values.service.ports.dnsUdp.port }}
      targetPort: {{ .Values.service.ports.dnsUdp.targetPort }}
      protocol: UDP
      name: dns-udp
    {{- end }}
    {{- if .Values.service.ports.snmp.enabled }}
    - port: {{ .Values.service.ports.snmp.port }}
      targetPort: {{ .Values.service.ports.snmp.targetPort }}
      protocol: UDP
      name: snmp
    {{- end }}
    {{- if .Values.service.ports.kerberosUdp.enabled }}
    - port: {{ .Values.service.ports.kerberosUdp.port }}
      targetPort: {{ .Values.service.ports.kerberosUdp.targetPort }}
      protocol: UDP
      name: kerberos-udp
    {{- end }}
{{- end }}
