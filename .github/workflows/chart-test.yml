name: Lint and Test Charts

on:
  pull_request:
    paths:
      - 'helm/**'
  push:
    branches:
      - main
    paths:
      - 'helm/**'

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.6.1

      - name: Run lint
        run: ct lint --charts helm/flamingo --validate-maintainers=false

      - name: Create kind cluster
        uses: helm/kind-action@v1.9.0

      - name: Run chart install and test
        run: |
          helm install flamingo helm/flamingo
          helm test flamingo
